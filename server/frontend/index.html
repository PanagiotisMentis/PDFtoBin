<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Converter GUI</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 25px; border-radius: 8px; box-shadow: 2px 2px 12px rgba(0,0,0,0.1); }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; font-weight: bold; }
        .output-box { margin-top: 10px; padding: 10px; background-color: #f4f4f4; border-radius: 4px; font-family: monospace; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Upload PDF for Conversion</h2>
        <form id="uploadForm">
            <input type="file" id="pdfFile" accept=".pdf" required />
            <br><br>
            <button type="submit">Convert PDF</button>
        </form>
        <div id="status"></div>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('pdfFile');
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            statusDiv.style.color = 'black';
            statusDiv.innerText = 'Processing PDF...';
            resultDiv.innerHTML = '';

            try {
                const response = await fetch('/upload_pdf', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if (response.ok) {
                    statusDiv.style.color = 'green';
                    statusDiv.innerText = result.message;
                    resultDiv.innerHTML = `
                        <p><strong>Output Directory Generated:</strong></p>
                        <div class="output-box">${result.output_directory}</div>
                    `;
                } else {
                    statusDiv.style.color = 'red';
                    statusDiv.innerText = 'Error: ' + result.detail;
                }
            } catch (err) {
                statusDiv.style.color = 'red';
                statusDiv.innerText = 'Failed to connect to backend server.';
            }
        });
    </script>
</body>
</html>
